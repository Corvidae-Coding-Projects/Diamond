[storage]
profile = "relational-v1"
version = 1

[storage.resources.Organizations]
scope = "id"
unique = [["name"]]
global_unique = true

[storage.resources.Members]
scope = "organization"
unique = [["organization", "user"]]

[storage.resources.Members.references.organization]
resource = "Organizations"
fields = { organization = "id" }

[storage.resources.Repositories]
scope = "id"
global_unique = true
unique = [["organization", "name"], ["organization", "id"]]
indexes = [["organization", "name"]]

[storage.resources.Issues]
scope = "repository"
unique = [["organization", "repository", "id"], ["organization", "repository", "rank"]]
indexes = [["organization", "repository", "rank"]]

[storage.resources.Issues.references.repository]
resource = "Repositories"
fields = { organization = "organization", repository = "id" }

[storage.resources.Comments]
scope = "repository"
unique = [["organization", "repository", "issue", "rank"]]
indexes = [["organization", "repository", "issue", "rank"]]

[storage.resources.Comments.references.issue]
resource = "Issues"
fields = { organization = "organization", repository = "repository", issue = "id" }

[storage.resources.MergeRequests]
scope = "repository"
unique = [["organization", "repository", "id"], ["organization", "repository", "rank"]]
indexes = [["organization", "repository", "rank"]]

[storage.resources.MergeRequests.references.repository]
resource = "Repositories"
fields = { organization = "organization", repository = "id" }

[storage.resources.Reviews]
scope = "repository"
unique = [["organization", "repository", "merge_request", "reviewer"]]
indexes = [["organization", "repository", "merge_request", "head"]]

[storage.resources.Reviews.references.merge_request]
resource = "MergeRequests"
fields = { organization = "organization", repository = "repository", merge_request = "id" }

[storage.resources.Teams]
scope = "organization"
unique = [["organization", "name"], ["organization", "id"]]
indexes = [["organization", "name"]]

[storage.resources.Teams.references.organization]
resource = "Organizations"
fields = { organization = "id" }

[storage.resources.TeamMembers]
scope = "repository"
unique = [["organization", "repository", "team", "user"]]
indexes = [["repository", "user"], ["organization", "repository", "team"]]

[storage.resources.TeamMembers.references.repository]
resource = "Repositories"
fields = { organization = "organization", repository = "id" }

[storage.resources.RepositoryGrants]
scope = "repository"
unique = [["organization", "repository", "user"]]
indexes = [["repository", "user"], ["organization", "repository"]]

[storage.resources.RepositoryGrants.references.repository]
resource = "Repositories"
fields = { organization = "organization", repository = "id" }

[storage.resources.Forks]
scope = "repository"
unique = [["organization", "repository"], ["organization", "parent", "repository"]]
indexes = [["organization", "parent"], ["organization", "repository"]]

[storage.resources.Forks.references.repository]
resource = "Repositories"
fields = { organization = "organization", repository = "id" }

[storage.resources.Milestones]
scope = "repository"
unique = [["repository", "title"]]
indexes = [["repository", "title"]]

[storage.resources.Milestones.references.repository]
resource = "Repositories"
fields = { organization = "organization", repository = "id" }

[storage.resources.Labels]
scope = "repository"
unique = [["repository", "name"], ["organization", "repository", "id"]]
indexes = [["repository", "name"]]

[storage.resources.Labels.references.repository]
resource = "Repositories"
fields = { organization = "organization", repository = "id" }

[storage.resources.IssueLabels]
scope = "repository"
unique = [["organization", "repository", "issue", "label"]]
indexes = [["organization", "repository", "issue"]]

[storage.resources.IssueLabels.references.issue]
resource = "Issues"
fields = { organization = "organization", repository = "repository", issue = "id" }

[storage.resources.IssueLabels.references.label]
resource = "Labels"
fields = { organization = "organization", repository = "repository", label = "id" }

[storage.resources.IssueAssignees]
scope = "repository"
unique = [["organization", "repository", "issue", "user"]]
indexes = [["organization", "repository", "issue"], ["repository", "user"]]

[storage.resources.IssueAssignees.references.issue]
resource = "Issues"
fields = { organization = "organization", repository = "repository", issue = "id" }

[storage.resources.BoardColumns]
scope = "repository"
unique = [["repository", "title"], ["repository", "position"], ["organization", "repository", "id"]]
indexes = [["repository", "position"]]

[storage.resources.BoardColumns.references.repository]
resource = "Repositories"
fields = { organization = "organization", repository = "id" }

[storage.resources.BoardCards]
scope = "repository"
unique = [["organization", "repository", "issue"], ["organization", "repository", "column", "position"]]
indexes = [["organization", "repository", "column", "position"]]

[storage.resources.BoardCards.references.issue]
resource = "Issues"
fields = { organization = "organization", repository = "repository", issue = "id" }

[storage.resources.BoardCards.references.column]
resource = "BoardColumns"
fields = { organization = "organization", repository = "repository", column = "id" }

[storage.resources.WikiPages]
scope = "repository"
unique = [["repository", "slug"]]
indexes = [["repository", "slug"]]

[storage.resources.WikiPages.references.repository]
resource = "Repositories"
fields = { organization = "organization", repository = "id" }

[storage.resources.Snippets]
scope = "repository"
unique = [["organization", "repository", "rank"]]
indexes = [["organization", "repository", "rank"]]

[storage.resources.Snippets.references.repository]
resource = "Repositories"
fields = { organization = "organization", repository = "id" }

[storage.resources.ReviewThreads]
scope = "repository"
unique = [["organization", "repository", "merge_request", "rank"]]
indexes = [["organization", "repository", "merge_request", "rank"]]

[storage.resources.ReviewThreads.references.merge_request]
resource = "MergeRequests"
fields = { organization = "organization", repository = "repository", merge_request = "id" }

[storage.resources.NotificationPreferences]
scope = "repository"
unique = [["owner", "repository"]]
indexes = [["owner", "repository"], ["repository"]]

[storage.resources.NotificationPreferences.references.repository]
resource = "Repositories"
fields = { repository = "id" }

[storage.resources.Notifications]
scope = "repository"
unique = [["organization", "repository", "id"]]
indexes = [["recipient", "read", "rank"], ["organization", "repository"], ["repository", "read", "rank"]]

[storage.resources.Notifications.references.repository]
resource = "Repositories"
fields = { organization = "organization", repository = "id" }

[storage.resources.Releases]
scope = "repository"
unique = [["repository", "tag"], ["repository", "rank"]]
indexes = [["organization", "repository", "rank"]]

[storage.resources.Releases.references.repository]
resource = "Repositories"
fields = { organization = "organization", repository = "id" }

[storage.resources.Webhooks]
scope = "repository"
unique = [["repository", "path"]]
indexes = [["repository", "path"]]

[storage.resources.Webhooks.references.repository]
resource = "Repositories"
fields = { organization = "organization", repository = "id" }

[storage.resources.AuditEvents]
scope = "repository"
unique = [["organization", "repository", "rank"]]
indexes = [["organization", "repository", "rank"]]

[storage.resources.AuditEvents.references.repository]
resource = "Repositories"
fields = { organization = "organization", repository = "id" }

[storage.lookups.OrganizationOwnership]
resource = "Organizations"
scope = "id"
principal = "owner"
purpose = "Allow organization owners to administer their namespace."

[storage.lookups.Membership]
resource = "Members"
scope = "organization"
principal = "user"
role = "role"
purpose = "Authorize organization members without exposing the member directory."

[storage.lookups.TeamAccess]
resource = "TeamMembers"
scope = "repository"
principal = "user"
role = "role"
purpose = "Authorize repository access granted through an organization team."

[storage.lookups.RepositoryPermission]
resource = "RepositoryGrants"
scope = "repository"
principal = "user"
role = "role"
purpose = "Authorize direct repository collaborator access."

[identity]
profile = "accounts-v1"
enrollment = "open"

[identity.oauth]
providers = ["google", "github"]
admission = "public"

[secrets.webhook_bearer]
adapter = "http"
binding = "webhook"
kind = "bearer"
audience = "webhook"

[secrets.google_oauth_client]
adapter = "oauth"
binding = "google"
kind = "oauth_client"
audience = "google"

[secrets.github_oauth_client]
adapter = "oauth"
binding = "github"
kind = "oauth_client"
audience = "github"

[http_api]
version = 1

[http_api.operations.repository_page]
function = "server.repository_page"
auth = "token"

[http_api.operations.issue_page]
function = "server.issue_page"
auth = "token"

[http_api.operations.read_issue]
function = "server.read_issue"
auth = "token"

[http_api.operations.merge_request_page]
function = "server.merge_request_page"
auth = "token"

[http_api.operations.collaboration_dashboard]
function = "server.collaboration_dashboard"
auth = "token"

[http_api.operations.create_issue]
function = "server.create_issue"
auth = "token"

[http_api.operations.add_issue_comment]
function = "server.add_issue_comment"
auth = "token"

[http_api.operations.create_merge_request_strategy]
function = "server.create_merge_request_strategy"
auth = "token"

[http_api.operations.approve_merge_request]
function = "server.approve_merge_request"
auth = "token"

[http_api.operations.create_release]
function = "server.create_release"
auth = "token"

[http_api.operations.create_wiki_page]
function = "server.create_wiki_page"
auth = "token"

[http_api.operations.create_snippet]
function = "server.create_snippet"
auth = "token"

[files]
profile = "shared-fs-v1"

[files.bindings.issue_attachments]
resource = "Issues"
max_bytes = 8388608

[files.bindings.release_assets]
resource = "Releases"
max_bytes = 8388608

[events.repository_activity]
resource = "Repositories"
payload = "Text"

[git]
profile = "git-v2"

[git.bindings.repos]
resource = "Repositories"

[delivery]
profile = "delivery-v1"

[delivery.bindings.builds]
resource = "Repositories"
git = "repos"
max_artifact_bytes = 67108864
max_pages_bytes = 67108864
max_pages_files = 1000

[delivery.bindings.builds.executors.standard]
memory_bytes = 536870912
max_processes = 128
max_file_bytes = 67108864

[delivery.bindings.builds.executors.small]
memory_bytes = 134217728
max_processes = 32
max_file_bytes = 16777216

[operations]
profile = "operations-v1"

[operations.bindings.control]
resource = "Repositories"
git = "repos"
delivery = "builds"
primary_shard = "primary"
search_resources = ["Repositories", "Issues", "MergeRequests", "WikiPages", "Releases"]
node_ttl_seconds = 30
rate_per_minute = 50
gc_grace_seconds = 3600
