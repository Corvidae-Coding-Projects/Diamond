schema_version = 1
name = "DiamondForge"
server = "server"
browser = "ui"
component = "GitForge"
styles = ["git.css"]
provides = ["Events", "Http<webhook>", "DbRead<Organizations>", "DbWrite<Organizations>", "DbRead<Members>", "DbWrite<Members>", "DbRead<Repositories>", "DbWrite<Repositories>", "DbRead<Issues>", "DbWrite<Issues>", "DbRead<Comments>", "DbWrite<Comments>", "DbRead<MergeRequests>", "DbWrite<MergeRequests>", "DbRead<Reviews>", "DbWrite<Reviews>", "DbRead<Teams>", "DbWrite<Teams>", "DbRead<TeamMembers>", "DbWrite<TeamMembers>", "DbRead<RepositoryGrants>", "DbWrite<RepositoryGrants>", "DbRead<Forks>", "DbWrite<Forks>", "DbRead<Milestones>", "DbWrite<Milestones>", "DbRead<Labels>", "DbWrite<Labels>", "DbRead<IssueLabels>", "DbWrite<IssueLabels>", "DbRead<IssueAssignees>", "DbWrite<IssueAssignees>", "DbRead<BoardColumns>", "DbWrite<BoardColumns>", "DbRead<BoardCards>", "DbWrite<BoardCards>", "DbRead<WikiPages>", "DbWrite<WikiPages>", "DbRead<Snippets>", "DbWrite<Snippets>", "DbRead<ReviewThreads>", "DbWrite<ReviewThreads>", "DbRead<Notifications>", "DbWrite<Notifications>", "DbRead<NotificationPreferences>", "DbWrite<NotificationPreferences>", "DbRead<Releases>", "DbWrite<Releases>", "DbRead<Webhooks>", "DbWrite<Webhooks>", "DbRead<AuditEvents>", "DbWrite<AuditEvents>", "GitRead<repos>", "GitWrite<repos>", "GitReview<repos>", "GitAdmin<repos>", "DeliveryRead<builds>", "DeliveryWrite<builds>", "OpsRead<control>", "OpsAdmin<control>"]

[modules.shared]
path = "shared.dia"
target = "shared"

[modules.server]
path = "server.dia"
target = "server"
imports = ["shared"]
provides = ["Events", "Http<webhook>", "DbRead<Organizations>", "DbWrite<Organizations>", "DbRead<Members>", "DbWrite<Members>", "DbRead<Repositories>", "DbWrite<Repositories>", "DbRead<Issues>", "DbWrite<Issues>", "DbRead<Comments>", "DbWrite<Comments>", "DbRead<MergeRequests>", "DbWrite<MergeRequests>", "DbRead<Reviews>", "DbWrite<Reviews>", "DbRead<Teams>", "DbWrite<Teams>", "DbRead<TeamMembers>", "DbWrite<TeamMembers>", "DbRead<RepositoryGrants>", "DbWrite<RepositoryGrants>", "DbRead<Forks>", "DbWrite<Forks>", "DbRead<Milestones>", "DbWrite<Milestones>", "DbRead<Labels>", "DbWrite<Labels>", "DbRead<IssueLabels>", "DbWrite<IssueLabels>", "DbRead<IssueAssignees>", "DbWrite<IssueAssignees>", "DbRead<BoardColumns>", "DbWrite<BoardColumns>", "DbRead<BoardCards>", "DbWrite<BoardCards>", "DbRead<WikiPages>", "DbWrite<WikiPages>", "DbRead<Snippets>", "DbWrite<Snippets>", "DbRead<ReviewThreads>", "DbWrite<ReviewThreads>", "DbRead<Notifications>", "DbWrite<Notifications>", "DbRead<NotificationPreferences>", "DbWrite<NotificationPreferences>", "DbRead<Releases>", "DbWrite<Releases>", "DbRead<Webhooks>", "DbWrite<Webhooks>", "DbRead<AuditEvents>", "DbWrite<AuditEvents>", "GitRead<repos>", "GitWrite<repos>", "GitReview<repos>", "GitAdmin<repos>", "DeliveryRead<builds>", "DeliveryWrite<builds>", "OpsRead<control>", "OpsAdmin<control>"]

[modules.ui]
path = "ui.dia"
target = "browser"
imports = ["shared", "operations"]

[modules.operations]
path = "operations.dia"
target = "browser"
imports = ["shared"]

