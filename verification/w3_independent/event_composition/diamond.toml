schema_version=1
name="IndependentEventComposition"
server="server"
browser="ui"
component="App"
[modules.shared]
path="shared.dia"
target="shared"
[modules.server]
path="server.dia"
target="server"
imports=["shared"]
[modules.ui]
path="ui.dia"
target="browser"
imports=["shared"]

[rpc]
add="server.add"
double="server.double"
echo_text="server.echo_text"
fail_int="server.fail_int"
fail_bool="server.fail_bool"
inspect_data="server.inspect_data"
echo_data="server.echo_data"
